name: Windows

# Windows build of Ruumble Client (packaging/windows/build.sh): a zip with ruumble-client.exe, its DLLs and Qt WebEngine.
# Called by release.yml for every release; runs on its own on pushes that touch the Windows build and on demand.
# On failure the end of the build log is attached as an annotation, so it can be read without signing in.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, "windows*"]
    paths:
      - "packaging/windows/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      # Mumble's patches are LF; long paths occur in Qt WebEngine and vcpkg
      - run: git config --global core.autocrlf false && git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: choco install ninja -y --no-progress
      # Qt with WebEngine as shared libraries (Mumble's own Windows build is static, which WebEngine does not allow)
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true
      - uses: actions/cache@v5
        with:
          path: work/vcpkg_installed
          key: vcpkg-windows-2022-${{ hashFiles('packaging/windows/vcpkg.json') }}
      - name: Build
        shell: bash
        run: packaging/windows/build.sh
      - name: Show the end of the log
        if: failure()
        shell: bash
        run: |
          for f in work/build.log work/configure.log work/deploy.log; do
            [ -f "$f" ] || continue
            msg=$(grep -E "error|Error|ERROR|FAILED|fatal" "$f" | tail -n 40; echo "-----"; tail -n 60 "$f")
            msg=$(printf '%s' "$msg" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$f::$msg"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: build-windows
          path: dist/Ruumble_Client-x86_64-windows.zip
          if-no-files-found: error
