name: Release

# Pushing a tag v<version> (VERSION, tools/release.sh) builds the AppImage, the native packages (.deb for Debian 12
# and Ubuntu 24.04, .rpm for Fedora, Arch Linux package), each in its own container, in parallel, and creates the
# GitHub release with all of them and SHA256SUMS; the notes are the version's section in CHANGELOG.md. No release
# unless every build succeeds. Windows is not supported (dropped by the team after 0.35.1).
# Started manually it is a dry run: it builds everything and uploads it as a workflow artifact, no release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PUBLISH: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - id: version
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          echo "Ruumble Client $version, Ruumble $(git -C server describe --tags --always)"
          if [[ "$PUBLISH" == "true" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $version"; exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || [[ "$PUBLISH" != "true" ]] || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # the AppImage always from Debian 12 (oldest glibc), the packages each in their distro's container
          - { name: AppImage, args: "appimage" }
          - { name: deb Debian 12, args: "package --distro debian12" }
          - { name: deb Ubuntu 24.04, args: "package --distro ubuntu2404" }
          - { name: rpm Fedora, args: "package --distro fedora" }
          - { name: Arch Linux, args: "package --distro arch" }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Mumble is cloned in the container at the tag from pins.env
      - run: ./package.sh ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ strategy.job-index }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.ref_type == 'tag' }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Assets and release notes
        run: |
          set -euo pipefail
          mkdir -p assets
          cp dist/Ruumble_Client-x86_64.AppImage "assets/Ruumble_Client-$VERSION-x86_64.AppImage"
          cp dist/*.deb dist/*.rpm dist/*.pkg.tar.zst assets/
          (cd assets && sha256sum * > SHA256SUMS)
          cat assets/SHA256SUMS
          deb12="$(cd assets && ls ruumble-client_*+debian12_*.deb)"
          deb2404="$(cd assets && ls ruumble-client_*+ubuntu2404_*.deb)"
          arch="$(cd assets && ls ruumble-client-*.pkg.tar.zst)"
          rpm="$(cd assets && ls ruumble-client-*.rpm)"
          {
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md
            echo
            echo "## Install"
            echo
            echo "Ruumble Client $VERSION is the Mumble 1.6 client with the building as its window. Guide: [README.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/README.md)."
            echo
            echo "- **Debian 12:** \`sudo apt install ./$deb12\`"
            echo "- **Ubuntu 24.04, Linux Mint 22:** \`sudo apt install ./$deb2404\`"
            echo "- **Fedora:** \`sudo dnf install ./$rpm\`"
            echo "- **Arch Linux:** \`sudo pacman -U $arch\`"
            echo "- **NixOS / Nix:** \`nix run github:$GITHUB_REPOSITORY/v$VERSION\`, or the flake in a NixOS configuration (\`programs.ruumble-client.enable = true;\`, see the README)"
            echo "- **Any other distribution:** \`Ruumble_Client-$VERSION-x86_64.AppImage\`, one file with Qt and Qt WebEngine inside (\`chmod +x\`, then start it)."
            echo
            echo "The packages replace an installed \`ruumble-desk\`. It needs a Ruumble service: [ruumble-server](https://github.com/ruumble-project/ruumble-server/releases)."
          } > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH != 'true'
        with:
          name: release-dryrun
          path: |
            assets
            notes.md

      - name: Create the GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --verify-tag \
            --title "Ruumble Client $VERSION" --notes-file notes.md
